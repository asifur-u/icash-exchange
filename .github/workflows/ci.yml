name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/icash_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/icash_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/icash_test
      AUTH_SECRET: ci-auth-secret
      CODE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DIR }}"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            docker compose ps
            curl -fsS --retry 8 --retry-delay 3 http://127.0.0.1/api/health
